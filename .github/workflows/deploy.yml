name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

# 允许 Pages 工作流写入产物与部署权限
permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只跑一个部署任务，避免并发覆盖
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          # 不启用 cache: 'npm'，因为仓库中没有 package-lock.json，
          # setup-node 会因找不到锁文件而直接失败。

      - name: Install dependencies
        # 同理，npm ci 要求存在 package-lock.json，此处改用 npm install
        run: npm install --no-audit --no-fund

      - name: Build site
        env:
          # 直接写死站点地址，不依赖仓库变量（变量页面需要管理员权限才能访问）
          # 若将来换域名，只需改这一行
          PUBLIC_SITE_URL: https://mjcui.github.io/lab-site/
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4