name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          # 不启用 cache: 'npm'，因为仓库中没有 package-lock.json，
          # setup-node 会因找不到锁文件而直接失败。

      - name: Install dependencies
        # npm ci 要求存在 package-lock.json，此处改用 npm install
        run: npm install --no-audit --no-fund

      - name: Run full verification
        run: npm run verify
