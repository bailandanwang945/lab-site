name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          # 不启用 cache: 'npm'，因为仓库中没有 package-lock.json，
          # setup-node 会因找不到锁文件而直接失败。

      - name: Install dependencies
        # npm ci 要求存在 package-lock.json，此处改用 npm install
        run: npm install --no-audit --no-fund

      - name: Run full verification
        env:
          # verify 的冒烟测试依赖这两个变量，
          # 缺失时 smoke-build.mjs 会直接退出并使CI 失败。
          PUBLIC_SITE_URL: https://mjcui.github.io/lab-site/
          CMS_GITHUB_REPO: mjcui/lab-site
          CMS_BRANCH: main
        run: npm run verify
